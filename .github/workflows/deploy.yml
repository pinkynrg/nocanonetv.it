name: Build & push images

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    env:
      REGISTRY_NAME: pinkynrg
      PROJECT_NAME: nocanonetv
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub login
        run: echo "${{ secrets.DOCKER_HUB_LOGIN_TOKEN }}" | docker login -u "$REGISTRY_NAME" --password-stdin

      - name: Build & push backend
        run: |
          IMG="$REGISTRY_NAME/$PROJECT_NAME-backend"
          docker build -f Dockerfile.backend -t "$IMG:$IMAGE_TAG" -t "$IMG:latest" .
          docker push "$IMG:$IMAGE_TAG"
          docker push "$IMG:latest"

      - name: Build & push frontend
        run: |
          IMG="$REGISTRY_NAME/$PROJECT_NAME-frontend"
          docker build -f Dockerfile.frontend -t "$IMG:$IMAGE_TAG" -t "$IMG:latest" .
          docker push "$IMG:$IMAGE_TAG"
          docker push "$IMG:latest"

      # Deploy is manual: pull the new :latest images from Portainer on the host
      # when needed. This workflow only builds and publishes them.
