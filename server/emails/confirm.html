<!DOCTYPE html>
<!-- Simple confirmation email. Can be regenerated with BeeFree keeping the {{tags}}. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="only light">
  <meta name="supported-color-schemes" content="light">
  <style>:root{color-scheme:only light}</style>
  <title>Conferma la tua iscrizione</title>
</head>
<body style="margin:0;padding:0">
  <div style="margin:0;padding:24px;background-color:#f5f5f4;font-family:Arial,Helvetica,sans-serif;color:#1c1917">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e7e5e4;border-radius:14px">
      <tr>
        <td style="padding:28px">
          <h1 style="margin:0 0 12px;font-size:22px;line-height:1.25;color:#1c1917">Ci siamo quasi, {{name}}.</h1>
          <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#1c1917">
            Per completare l'iscrizione al promemoria del canone TV, conferma che questo
            indirizzo email è tuo.
          </p>
          <table role="presentation" cellpadding="0" cellspacing="0">
            <tr>
              <td style="border-radius:9px;background:#2a4d8f">
                <a href="{{confirm_url}}" style="display:inline-block;padding:12px 22px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:9px">
                  Conferma l'iscrizione
                </a>
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0;font-size:13px;line-height:1.6;color:#78716c">
            Se non hai richiesto tu l'iscrizione, ignora questa email: senza conferma non ti
            scriveremo più.
          </p>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
